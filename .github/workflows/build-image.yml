name: 构建生产镜像

# 为什么在 CI 里构建、而不是在服务器上：
# 生产服务器只有 2 核 / 1.6G 内存（可用不到 600M），`next build` 会 OOM 或狂刷 swap。
# 这里用 GitHub 的机器（4 核 7G+）编译成 linux/amd64 镜像推到 ghcr，
# 服务器只做 `docker compose pull && up -d`——零编译。
#
# 镜像按 commit sha 打标签：回滚 = 把 compose 指回上一个 sha 标签再 up -d。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# 镜像名必须全小写（ghcr 的硬要求）：${{ github.repository }} 会带上仓库的大小写
# （Tylor110077/WeichuanERP），直接拿来当镜像名会被拒。
env:
  IMAGE: ghcr.io/tylor110077/weichuanerp

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: 登录 ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送（linux/amd64）
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          # 低内存构建的参数在 Dockerfile 里有默认值；CI 内存宽裕，可以调高加速
          build-args: |
            NODE_BUILD_MEM=2048
          tags: |
            ${{ env.IMAGE }}:sha-${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
