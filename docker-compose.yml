# 维川进销存 生产编排（文档 8.4）
# 单机部署：docker compose up -d （需先按 docs/部署指南.md 准备 .env）
services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请设置 MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: weichuan_erp
      MYSQL_USER: weichuan
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请设置 MYSQL_PASSWORD}
      TZ: Asia/Shanghai
    volumes:
      - mysql_data:/var/lib/mysql
      # 每日全量备份（容器内），宿主机 cron 或另挂存储做异地留存（8.3）
      - ./backups:/backups
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "weichuan", "-p${MYSQL_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    # 生产用 CI 预构建镜像（GitHub Actions 构建后推 ghcr.io，服务器只 pull、不编译——
    # 生产机内存小，原地构建会打满内存拖垮线上）。换版本改 APP_IMAGE 或跑 scripts/deploy.sh。
    # 要在这台机器上自建镜像（不推荐）：把下面这行换成 `build: .` 即可，见 docs/部署指南.md §6。
    image: ${APP_IMAGE:-ghcr.io/tylor110077/weichuanerp:latest}
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql://weichuan:${MYSQL_PASSWORD}@mysql:3306/weichuan_erp
      NODE_ENV: production
      ADMIN_INIT_PASSWORD: ${ADMIN_INIT_PASSWORD:-Admin@12345}
      TZ: Asia/Shanghai
      BACKUP_DIR: /backups # 供 /api/health 检查备份新鲜度
    volumes:
      - ./backups:/backups # 可读写：应用自己生成备份包，界面上可下载/导入恢复
    ports:
      - "127.0.0.1:3000:3000" # 仅本机回环，公网由 Nginx 反代（见部署指南）

volumes:
  mysql_data:
